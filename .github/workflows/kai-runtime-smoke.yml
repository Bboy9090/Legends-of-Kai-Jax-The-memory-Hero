name: Kai Runtime Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kai-runtime-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Materialize exact web workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git config core.sparseCheckout true
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          test -f pnpm-lock.yaml

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Resolve Playwright test runner
        run: |
          PW_PACKAGE="$(pnpm -C apps/web exec node -p "require.resolve('@playwright/test/package.json')")"
          PW_CLI="$(dirname "${PW_PACKAGE}")/cli.js"
          test -f "${PW_CLI}"
          echo "PW_CLI=${PW_CLI}" >> "${GITHUB_ENV}"
          node "${PW_CLI}" --version

      - name: Install Chromium runtime
        # Hosted runners already carry Chromium's Linux shared-library runtime.
        # Avoid `--with-deps`: it runs apt update against unrelated third-party
        # repos, and a transient Google Packages hash mismatch can block every
        # gameplay test before Playwright itself even starts.
        run: node "${PW_CLI}" install chromium

      - name: Run Kai live runtime sequence
        run: node "${PW_CLI}" test apps/web/e2e/kai-runtime.spec.ts --config=apps/web/playwright.config.ts

      - name: Upload-free evidence summary
        if: always()
        run: |
          echo "Kai runtime smoke completed for ${GITHUB_SHA}"
          echo "The workflow result is the durable PR evidence; the developer proxy is not a canon model certification."
