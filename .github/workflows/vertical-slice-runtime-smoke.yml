name: Vertical Slice Runtime Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertical-slice-runtime-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Materialize exact web workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git config core.sparseCheckout true
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          test -f pnpm-lock.yaml

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Resolve Playwright test runner
        run: |
          PW_PACKAGE="$(pnpm -C apps/web exec node -p "require.resolve('@playwright/test/package.json')")"
          PW_CLI="$(dirname "${PW_PACKAGE}")/cli.js"
          test -f "${PW_CLI}"
          echo "PW_CLI=${PW_CLI}" >> "${GITHUB_ENV}"
          node "${PW_CLI}" --version

      - name: Install Chromium runtime
        run: node "${PW_CLI}" install --with-deps chromium

      - name: Run Ashblock Heights Kai/Jax live runtime and completion chains
        run: >-
          node "${PW_CLI}" test
          apps/web/e2e/vertical-slice-runtime.spec.ts
          apps/web/e2e/ashblock-completion-runtime.spec.ts
          --config=apps/web/playwright.config.ts

      - name: Upload-free evidence summary
        if: always()
        run: |
          echo "Vertical slice runtime smoke completed for ${GITHUB_SHA}"
          echo "This verifies the Ashblock developer slice, real Kai/Jax controller paths, Fang combat loop, Memory Trace, extraction, and mission completion persistence; it does not certify final production art or manuscript chronology."
