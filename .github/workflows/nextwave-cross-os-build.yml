name: Next Wave Cross-OS Desktop Release (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update'
        required: false
        default: 'desktop-v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Clone repo (zero external actions)
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
      - name: Build Vite frontend & ZIES Gate & Windows .exe
        shell: pwsh
        env:
          CI: 'true'
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          Write-Host 'No Vite prebuild needed'
          python -m pip install --upgrade pip pyinstaller pywebview flask psutil pillow
          python scripts/zies_gate.py
          python desktop_suite/build_windows_exe.py
          gh release upload "$env:TAG" dist_windows/*.exe --clobber

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Clone repo & Build macOS .app.zip (zero external actions)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          echo 'No Vite prebuild needed'
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade pip pyinstaller pywebview flask psutil pillow
          python3 scripts/zies_gate.py
          bash desktop_suite/build_macos_linux.sh
          gh release upload "$TAG" dist_macos/*-macOS.zip --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo & Build Linux .tar.gz (zero external actions)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          echo 'No Vite prebuild needed'
          sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libcairo2-dev libgirepository1.0-dev
          python3 -m pip install --upgrade pip pyinstaller pywebview flask psutil pillow
          python3 scripts/zies_gate.py
          bash desktop_suite/build_macos_linux.sh
          gh release upload "$TAG" dist_linux/*-Linux-x86_64.tar.gz --clobber
