name: Production Preview Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-preview-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Materialize exact web workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git config core.sparseCheckout true
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          test -f pnpm-lock.yaml

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Build production web payload
        run: pnpm -C apps/web build

      - name: Resolve Playwright test runner
        run: |
          PW_PACKAGE="$(pnpm -C apps/web exec node -p "require.resolve('@playwright/test/package.json')")"
          PW_CLI="$(dirname "${PW_PACKAGE}")/cli.js"
          test -f "${PW_CLI}"
          echo "PW_CLI=${PW_CLI}" >> "${GITHUB_ENV}"
          node "${PW_CLI}" --version

      - name: Install Chromium runtime
        # The hosted runner already has Chromium's shared-library dependencies.
        # Avoid apt update so an unrelated third-party repository cannot block
        # production-preview evidence before the browser test starts.
        run: node "${PW_CLI}" install chromium

      - name: Start built preview
        run: |
          pnpm -C apps/web preview --host 127.0.0.1 --port 4173 > /tmp/kai-jax-preview.log 2>&1 &
          echo $! > /tmp/kai-jax-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kai-jax-preview.log
          exit 1

      - name: Run production preview smoke
        run: node "${PW_CLI}" test apps/web/e2e/production-preview.spec.ts --config=apps/web/playwright.preview.config.ts

      - name: Preview evidence summary
        if: always()
        run: |
          echo "Production preview smoke completed for ${GITHUB_SHA}"
          if test -f /tmp/kai-jax-preview.log; then tail -n 80 /tmp/kai-jax-preview.log; fi
          echo "This gate certifies built-preview mounting only; it is not a signed native release or physical-device certification."
