name: Mobile Store Readiness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobile-store-readiness-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-cert:
    name: Web + Capacitor source certification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        working-directory: source
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Test, typecheck, validate rigs, and build web
        working-directory: source
        run: |
          pnpm -C apps/web test
          pnpm -C apps/web typecheck
          node apps/web/scripts/validate-registry.mjs
          pnpm -C apps/web build

      - name: Verify mobile identity and web output
        working-directory: source
        run: |
          test -s apps/web/dist/index.html
          test -s apps/web/dist/privacy.html
          test -s apps/web/dist/terms.html
          ! grep -q 'legendsofkaijax.com/privacy' apps/web/src/components/game/SettingsMenu.tsx
          ! grep -q 'legendsofkaijax.com/terms' apps/web/src/components/game/SettingsMenu.tsx
          grep -q '"version": "1.0.0"' apps/web/package.json
          grep -q 'versionName "1.0.0"' apps/web/android/app/build.gradle
          grep -q 'compileSdkVersion = 36' apps/web/android/variables.gradle
          grep -q 'targetSdkVersion = 36' apps/web/android/variables.gradle
          grep -q 'MARKETING_VERSION = 1.0.0;' apps/web/ios/App/App.xcodeproj/project.pbxproj
          grep -q 'versionCode 1' apps/web/android/app/build.gradle
          grep -q 'CURRENT_PROJECT_VERSION = 1;' apps/web/ios/App/App.xcodeproj/project.pbxproj
          grep -q "com.bobbyblanco.legendsofkaijax" apps/web/capacitor.config.ts
          grep -q "Legends of Kai-Jax" apps/web/capacitor.config.ts
          grep -q 'applicationId "com.bobbyblanco.legendsofkaijax"' apps/web/android/app/build.gradle
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.bobbyblanco.legendsofkaijax;" apps/web/ios/App/App.xcodeproj/project.pbxproj
          test "$(grep -c 'DEVELOPMENT_TEAM = 86NUJ8M3B8;' apps/web/ios/App/App.xcodeproj/project.pbxproj)" -ge 2
          test -s apps/web/ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          grep -q 'BlueprintIdentifier = "504EC3031FED79650016851F"' apps/web/ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          grep -q 'buildForArchiving = "YES"' apps/web/ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          grep -q 'buildConfiguration = "Release"' apps/web/ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          test -x ci_scripts/ci_post_clone.sh
          grep -q 'pnpm -C apps/web cap:sync' ci_scripts/ci_post_clone.sh

  android-release:
    name: Android release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Verify Java and activate pnpm
        working-directory: source
        run: |
          java -version
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install, build, and sync Android
        working-directory: source
        run: |
          pnpm install --filter ./apps/web... --frozen-lockfile
          pnpm -C apps/web build
          cd apps/web
          npx cap sync android

      - name: Build unsigned release AAB
        working-directory: source/apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          AAB_BYTES="$(stat -c%s "$AAB")"
          AAB_MB="$(awk -v bytes="$AAB_BYTES" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')"
          BASE_ASSET_COMPRESSED_BYTES="$(unzip -lv "$AAB" | awk '$8 ~ /^base\/assets\// { sum += $5 } END { print sum + 0 }')"
          BASE_ASSET_COMPRESSED_MB="$(awk -v bytes="$BASE_ASSET_COMPRESSED_BYTES" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')"
          echo "ANDROID_AAB_SIZE_MB=$AAB_MB"
          echo "ANDROID_BASE_ASSET_ZIP_SIZE_MB=$BASE_ASSET_COMPRESSED_MB"
          sha256sum "$AAB"
          printf '%s\n' "ANDROID_RELEASE_AAB_OK ${{ github.event.pull_request.head.sha || github.sha }}"

  ios-release-compile:
    name: iOS Release compile
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm
        working-directory: source
        run: |
          xcodebuild -version
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install, build, and sync iOS
        working-directory: source
        run: |
          pnpm install --filter ./apps/web... --frozen-lockfile
          pnpm -C apps/web build
          cd apps/web
          npx cap sync ios

      - name: Compile iOS Release without signing
        working-directory: source/apps/web/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../../ios-release-build.log

      - name: Verify iOS release evidence
        working-directory: source/apps/web
        run: |
          test -s ios-release-build.log
          grep -q "com.bobbyblanco.legendsofkaijax" ios/App/App.xcodeproj/project.pbxproj
          grep -Fq "** BUILD SUCCEEDED **" ios-release-build.log
          printf '%s\n' "IOS_RELEASE_COMPILE_OK ${{ github.event.pull_request.head.sha || github.sha }}"


  runtime-mobile-e2e:
    name: Production mobile runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm and install web graph
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Install Chromium for release smoke
        working-directory: source
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Run production smoke gate
        working-directory: source
        run: pnpm -C apps/web exec playwright test e2e/smoke.spec.ts --workers=1

      - name: Run mobile performance gate
        working-directory: source
        run: pnpm -C apps/web exec playwright test e2e/phase-b2-mobile-performance.spec.ts --workers=1

  ios-device-archive:
    name: iOS unsigned device archive
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Build web and sync iOS
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --filter ./apps/web... --frozen-lockfile
          pnpm -C apps/web build
          cd apps/web
          npx cap sync ios

      - name: Archive iphoneos Release without signing
        working-directory: source/apps/web/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/LegendsOfKaiJax.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee ../../ios-device-archive.log

      - name: Verify device archive metadata
        working-directory: source/apps/web/ios/App
        run: |
          APP="build/LegendsOfKaiJax.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          test -x "$APP/App"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.bobbyblanco.legendsofkaijax"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "1"
          printf '%s\n' "IOS_DEVICE_ARCHIVE_OK ${{ github.event.pull_request.head.sha || github.sha }}"
