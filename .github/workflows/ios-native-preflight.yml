name: iOS Native Preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-preflight-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Materialize exact web workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git config core.sparseCheckout true
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          test -f pnpm-lock.yaml

      - name: Verify Xcode and native toolchain
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          if [ -z "${XCODE_MAJOR}" ] || [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "Xcode 26 or newer is required for the App Store admission lane."
            exit 1
          fi
          ruby --version
          pod --version

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Build web payload
        run: pnpm -C apps/web build

      - name: Sync Capacitor iOS project
        run: pnpm -C apps/web exec cap sync ios

      - name: Install CocoaPods
        working-directory: apps/web/ios/App
        run: pod install

      - name: Build unsigned iOS simulator target
        working-directory: apps/web/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Native preflight evidence
        if: always()
        run: |
          echo "iOS native preflight completed for ${GITHUB_SHA}."
          echo "This proves an unsigned simulator build only; App Store archive/signing remains a separate Mac/Xcode gate."
