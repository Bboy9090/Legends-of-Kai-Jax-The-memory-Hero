name: iOS Native Preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-preflight-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Materialize exact web workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git config core.sparseCheckout true
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          test -f pnpm-lock.yaml

      - name: Verify Xcode and native toolchain
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          if [ -z "${XCODE_MAJOR}" ] || [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "Xcode 26 or newer is required for the App Store admission lane."
            exit 1
          fi
          ruby --version
          pod --version

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Validate App Store admission metadata
        run: |
          set -euo pipefail

          INFO_PLIST="apps/web/ios/App/App/Info.plist"
          PROJECT_FILE="apps/web/ios/App/App.xcodeproj/project.pbxproj"
          PODFILE="apps/web/ios/App/Podfile"
          APPICON_JSON="apps/web/ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json"
          APPICON_PNG="apps/web/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"

          plutil -lint "${INFO_PLIST}"

          ENCRYPTION_FLAG="$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "${INFO_PLIST}")"
          test "${ENCRYPTION_FLAG}" = "false"

          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.bobbyblanco.legendsofkaijax;' "${PROJECT_FILE}"
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' "${PROJECT_FILE}"
          grep -q "platform :ios, '15.0'" "${PODFILE}"

          ! grep -q 'armv7' "${INFO_PLIST}"

          test -f "${APPICON_PNG}"
          grep -q '"platform" : "ios"' "${APPICON_JSON}"
          grep -q '"idiom" : "universal"' "${APPICON_JSON}"
          grep -q '"size" : "1024x1024"' "${APPICON_JSON}"

          # pnpm's workspace install exposes @capacitor/ios from repository-root
          # node_modules; the native Podfile resolves the same root location.
          CAPACITOR_PRIVACY_MANIFEST="$(find node_modules/@capacitor/ios -name PrivacyInfo.xcprivacy -print -quit)"
          if [ -z "${CAPACITOR_PRIVACY_MANIFEST}" ]; then
            echo "Capacitor PrivacyInfo.xcprivacy is missing from the installed iOS SDK."
            exit 1
          fi
          plutil -lint "${CAPACITOR_PRIVACY_MANIFEST}"

          echo "App Store admission metadata checks passed."
          echo "Capacitor privacy manifest: ${CAPACITOR_PRIVACY_MANIFEST}"

      - name: Build web payload
        run: pnpm -C apps/web build

      - name: Sync Capacitor iOS project
        run: pnpm -C apps/web exec cap sync ios

      - name: Install CocoaPods
        working-directory: apps/web/ios/App
        run: pod install

      - name: Build unsigned iOS simulator target
        working-directory: apps/web/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Native preflight evidence
        if: always()
        run: |
          EXACT_HEAD="$(git rev-parse HEAD)"
          echo "iOS native preflight executed against exact head ${EXACT_HEAD}."
          echo "A green job proves the enforced App Store admission metadata checks plus an unsigned simulator build."
          echo "Signed archive validation remains a separate Mac/Xcode gate."
