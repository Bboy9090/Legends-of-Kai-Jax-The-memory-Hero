name: APK Candidate Build

on:
  push:
    branches:
      - codex/apk-build-20260823
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm cap:sync
      - name: Assemble installable candidate APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Legends-of-Kai-Jax-1.0.0-debug-apk
          path: |
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            apps/web/android/app/build/outputs/apk/debug/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30
