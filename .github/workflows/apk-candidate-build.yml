name: APK Candidate Build

on:
  push:
    branches:
      - codex/apk-build-20260823
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          java -version
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm build

      - name: Sync Capacitor Android project
        run: pnpm cap:sync

      - name: Assemble installable candidate APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/APK-SHA256.txt

      - name: Upload APK and checksum
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: Legends-of-Kai-Jax-1.0.0-debug-apk
          path: |
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            apps/web/android/app/build/outputs/apk/debug/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30
