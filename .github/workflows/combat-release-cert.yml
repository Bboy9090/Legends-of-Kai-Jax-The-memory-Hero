name: Combat Release Certification

on:
  push:
    branches:
      - feature/fighter-select-v2
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Push + PR events for the same commit share one lane instead of competing.
  group: combat-release-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: Release Certification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Materialize exact commit without external actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/tarball/${COMMIT_SHA}" \
            --output source.tar.gz
          tar --extract --gzip --file source.tar.gz --strip-components=1
          rm source.tar.gz
          test -f package.json
          printf '%s\n' "${COMMIT_SHA}" > .certified-head-sha

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Canonical release certification
        run: pnpm validate:release
