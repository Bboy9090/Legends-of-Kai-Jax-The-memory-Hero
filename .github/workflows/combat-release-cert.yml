name: Combat Release Certification

on:
  push:
    branches:
      - feature/fighter-select-v2
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Push + PR events for the same commit share one lane instead of competing.
  group: combat-release-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: Release Certification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Sparse materialize exact web workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git config core.sparseCheckout true
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          test -f package.json
          test -f pnpm-lock.yaml

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Canonical release certification
        run: pnpm validate:release
