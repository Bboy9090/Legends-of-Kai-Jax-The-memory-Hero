name: Combat Release Certification

on:
  push:
    branches:
      - feature/fighter-select-v2
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: combat-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: Validate, Test, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web workspace
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Combat release gate
        run: pnpm validate:release

      - name: Full unit suite
        run: pnpm test
