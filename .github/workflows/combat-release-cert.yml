name: Combat Release Certification

on:
  push:
    branches:
      - feature/fighter-select-v2
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Push + PR events for the same commit share one lane instead of competing.
  group: combat-release-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: Release Certification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit without external actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Canonical release certification
        run: pnpm validate:release
