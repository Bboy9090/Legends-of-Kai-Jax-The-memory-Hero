name: Upgrade System CI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'packages/shared/src/types/upgrade.types.ts'
      - 'packages/shared/src/data/**/*.ts'
      - 'packages/shared/src/utils/*Upgrade*.ts'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/shared/src/types/upgrade.types.ts'
      - 'packages/shared/src/data/**/*.ts'
      - 'packages/shared/src/utils/*Upgrade*.ts'

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
