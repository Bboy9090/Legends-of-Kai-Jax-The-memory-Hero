name: Upgrade System CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'packages/shared/src/types/upgrade.types.ts'
      - 'packages/shared/src/data/**/*.ts'
      - 'packages/shared/src/utils/*Upgrade*.ts'
      - '.github/workflows/upgrade-system-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/shared/src/types/upgrade.types.ts'
      - 'packages/shared/src/data/**/*.ts'
      - 'packages/shared/src/utils/*Upgrade*.ts'
      - '.github/workflows/upgrade-system-ci.yml'

concurrency:
  group: upgrade-system-ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install exact lockfile
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: source
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install exact lockfile
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Test web
        working-directory: source
        run: pnpm -C apps/web test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install exact lockfile
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: source
        run: pnpm run build
