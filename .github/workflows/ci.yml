name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm
        working-directory: source
        run: |
          node --version
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install web dependency graph
        working-directory: source
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Typecheck, build, and test
        working-directory: source
        run: |
          pnpm -C apps/web typecheck
          pnpm -C apps/web build
          pnpm -C apps/web test
