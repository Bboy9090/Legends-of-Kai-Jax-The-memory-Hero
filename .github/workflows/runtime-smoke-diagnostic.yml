name: Runtime Smoke Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/runtime-smoke-diagnostic.yml'
  workflow_dispatch:

concurrency:
  group: runtime-smoke-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Materialize exact web workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --filter=blob:none --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages .github
          git checkout --detach "${COMMIT_SHA}"
          git show "${COMMIT_SHA}:package.json" > package.json
          git show "${COMMIT_SHA}:pnpm-lock.yaml" > pnpm-lock.yaml
          git show "${COMMIT_SHA}:pnpm-workspace.yaml" > pnpm-workspace.yaml
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Install web graph
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Verify release React renderer graph
        working-directory: source
        run: |
          grep -q '"@react-three/postprocessing": "2.19.1"' apps/web/package.json
          grep -q 'dedupe: \["react", "react-dom", "@react-three/fiber"\]' apps/web/vite.config.ts
          pnpm -C apps/web list react react-dom @react-three/fiber @react-three/drei @react-three/postprocessing --depth 0

      - name: Install Chromium
        working-directory: source
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Run release and mobile touch smoke
        working-directory: source
        run: |
          pnpm -C apps/web exec playwright test \
            e2e/smoke.spec.ts \
            e2e/mobile-menu-links.spec.ts \
            e2e/menu-modes-action-certification.spec.ts \
            e2e/campaign-progression.spec.ts

      - name: Verify mission-completion evidence contract
        working-directory: source
        run: node apps/web/scripts/story-mission-completion-workflow.test.mjs

      - name: Run full Mission 6 state-driven completion certification
        working-directory: source/apps/web
        env:
          CI: "true"
        run: |
          set -o pipefail
          pnpm exec playwright test \
            --config=playwright.m6-dev.config.ts \
            e2e/mission6-flow.devtest.ts \
            --grep 'M6-C real mission UI' \
            --workers=1 2>&1 | tee mission6-completion.log
          {
            echo "STORY_MISSION_COMPLETION=PASS"
            echo "SOURCE_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "MISSION=story_act2_m6"
            echo "EVIDENCE_CLASS=state-driven-software-integration"
            echo "PHYSICAL_DEVICE_CERTIFICATION=NOT_PROVEN"
            echo "USER_EXECUTED_ATTACKS=NOT_PROVEN"
          } | tee mission6-completion-receipt.txt

      - name: Publish full mission software evidence
        if: always()
        working-directory: source/apps/web
        run: |
          {
            echo '## Mission 6 software completion evidence'
            echo
            echo '```text'
            if [ -f mission6-completion-receipt.txt ]; then
              cat mission6-completion-receipt.txt
            else
              echo 'STORY_MISSION_COMPLETION=NOT_PROVEN'
              echo 'CERTIFICATION_RESULT=FAILED_OR_INCOMPLETE'
            fi
            echo '```'
            echo
            echo '- Evidence class: state-driven software integration.'
            echo '- Physical-device certification: not proven.'
            echo '- User-executed attack inputs: not proven.'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ -f mission6-completion.log ]; then
            echo '--- Mission 6 completion log tail ---'
            tail -n 200 mission6-completion.log
          fi
