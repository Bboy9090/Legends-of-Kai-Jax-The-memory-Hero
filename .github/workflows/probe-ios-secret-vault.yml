name: Probe Kai-Jax iOS Secret Vault

on:
  push:
    branches:
      - temp-ignore
    paths:
      - ".github/workflows/probe-ios-secret-vault.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Probe iOS secret presence
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          {
            if [ -n "$IOS_P12_BASE64" ]; then echo "IOS_P12_BASE64_PRESENT=true"; else echo "IOS_P12_BASE64_PRESENT=false"; fi
            if [ -n "$IOS_P12_PASSWORD" ]; then echo "IOS_P12_PASSWORD_PRESENT=true"; else echo "IOS_P12_PASSWORD_PRESENT=false"; fi
            if [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then echo "IOS_PROVISIONING_PROFILE_BASE64_PRESENT=true"; else echo "IOS_PROVISIONING_PROFILE_BASE64_PRESENT=false"; fi
            if [ -n "$IOS_TEAM_ID" ]; then echo "IOS_TEAM_ID_PRESENT=true"; else echo "IOS_TEAM_ID_PRESENT=false"; fi
          } | tee ios-vault-state.txt
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kai-jax-ios-vault-probe
          path: ios-vault-state.txt
          if-no-files-found: ignore
          retention-days: 7
