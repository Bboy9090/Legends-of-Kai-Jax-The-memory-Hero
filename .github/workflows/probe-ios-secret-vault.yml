name: Probe Kai-Jax iOS Secret Vault

on:
  push:
    branches:
      - temp-ignore
    paths:
      - ".github/workflows/probe-ios-secret-vault.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe iOS secret presence
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "IOS_P12_BASE64_PRESENT=$([ -n "$IOS_P12_BASE64" ] && echo true || echo false)"
          echo "IOS_P12_PASSWORD_PRESENT=$([ -n "$IOS_P12_PASSWORD" ] && echo true || echo false)"
          echo "IOS_PROVISIONING_PROFILE_BASE64_PRESENT=$([ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && echo true || echo false)"
          echo "IOS_TEAM_ID_PRESENT=$([ -n "$IOS_TEAM_ID" ] && echo true || echo false)"
