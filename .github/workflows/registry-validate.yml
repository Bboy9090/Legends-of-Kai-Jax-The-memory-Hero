name: Registry Validation

on:
  pull_request:
    paths:
      - "apps/web/src/assets/modelRegistry.ts"
      - "apps/web/public/models/**"
      - "apps/web/scripts/validate-registry.mjs"
      - ".github/workflows/registry-validate.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "apps/web/src/assets/modelRegistry.ts"
      - "apps/web/public/models/**"
      - "apps/web/scripts/validate-registry.mjs"
      - ".github/workflows/registry-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate MODEL_REGISTRY
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Materialize exact registry workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git config core.sparseCheckout true
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set apps/web
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          test -f apps/web/src/assets/modelRegistry.ts
          test -f apps/web/scripts/validate-registry.mjs
          test -d apps/web/public/models

      - name: Runtime identity
        run: |
          node --version
          git rev-parse HEAD
          echo "Expected head: ${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run registry validator
        working-directory: apps/web
        run: |
          set +e
          node scripts/validate-registry.mjs 2>&1 | tee /tmp/registry-report.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "REGISTRY_VALIDATOR_EXIT=${status}" >> "${GITHUB_ENV}"
          exit "${status}"

      - name: Registry evidence summary
        if: always()
        run: |
          echo "## Registry Validation" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Head: \`${{ github.event.pull_request.head.sha || github.sha }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Validator exit: \`${REGISTRY_VALIDATOR_EXIT:-not-run}\`" >> "${GITHUB_STEP_SUMMARY}"
          if test -f /tmp/registry-report.txt; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo '```text' >> "${GITHUB_STEP_SUMMARY}"
            tail -n 80 /tmp/registry-report.txt >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
