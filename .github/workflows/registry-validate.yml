name: Registry Validation

on:
  pull_request:
    paths:
      - "apps/web/src/assets/modelRegistry.ts"
      - "apps/web/public/models/**"
      - "apps/web/scripts/validate-registry.mjs"
      - ".github/workflows/registry-validate.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "apps/web/src/assets/modelRegistry.ts"
      - "apps/web/public/models/**"
      - "apps/web/scripts/validate-registry.mjs"
      - ".github/workflows/registry-validate.yml"
  workflow_dispatch:

jobs:
  validate-registry:
    name: Validate MODEL_REGISTRY
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Run registry validator
        working-directory: source/apps/web
        run: node scripts/validate-registry.mjs

      - name: Re-run with JSON-only output (artifact)
        if: always()
        working-directory: source/apps/web
        run: |
          set +e
          node scripts/validate-registry.mjs > registry-report.txt 2>&1
          echo "exit=$?" >> registry-report.txt
          set -e

      - name: Print registry evidence
        if: always()
        working-directory: source/apps/web
        run: |
          test -f registry-report.txt
          cat registry-report.txt
