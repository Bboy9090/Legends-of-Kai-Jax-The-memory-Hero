name: Security Baseline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit without reusable actions
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Activate pnpm
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Audit production dependency graph
        working-directory: source
        run: |
          pnpm install --filter ./apps/web... --frozen-lockfile
          cd apps/web
          pnpm audit --prod --audit-level high

      - name: Scan tracked files for common private-key material
        working-directory: source
        run: |
          if git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY|BEGIN CERTIFICATE' -- ':!*.md' ':!*.txt' ':!.github/workflows/codeql.yml'; then
            echo "Potential private key or certificate material is tracked in the repository."
            exit 1
          fi
