name: Release Original-IP Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release-original-ip.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-original-ip-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  release-artifact-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Materialize exact workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --filter=blob:none --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages
          git checkout --detach "${COMMIT_SHA}"
          git show "${COMMIT_SHA}:package.json" > package.json
          git show "${COMMIT_SHA}:pnpm-lock.yaml" > pnpm-lock.yaml
          git show "${COMMIT_SHA}:pnpm-workspace.yaml" > pnpm-workspace.yaml
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Install web graph
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Build exact production artifact
        working-directory: source/apps/web
        run: npm run build

      - name: Audit production artifact for restricted third-party terms
        working-directory: source/apps/web
        run: node scripts/audit-release-ip.mjs
