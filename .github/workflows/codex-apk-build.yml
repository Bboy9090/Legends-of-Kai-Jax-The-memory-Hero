name: Codex APK Build
on:
  push:
    branches:
      - 'codex/apk-build-2026-08-23'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run build
      - working-directory: apps/web
        run: npx cap sync android
      - working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - run: sha256sum apps/web/android/app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Legends-of-Kai-Jax-debug-APK
          path: |
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          retention-days: 30
