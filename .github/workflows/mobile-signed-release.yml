name: Mobile Signed Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Signed artifact to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      source_sha:
        description: "Exact source commit to sign"
        required: true
        default: "2ff7979402e51b54cf5e6296645d9164de2a7568"
        type: string

permissions:
  contents: write

jobs:
  android-signed-aab:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    name: Android signed Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Require Android signing credentials
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact commit
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.source_sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Prepare web and Android
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --filter ./apps/web... --frozen-lockfile
          pnpm -C apps/web build
          cd apps/web
          npx cap sync android

      - name: Materialize temporary keystore
        working-directory: source/apps/web/android
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-upload.jks
          test -s release-upload.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/release-upload.jks" >> "$GITHUB_ENV"

      - name: Build and verify signed AAB
        working-directory: source/apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease --stacktrace
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          sha256sum "$AAB"
          printf '%s\n' "ANDROID_SIGNED_AAB_OK ${{ inputs.source_sha }}"

      - name: Persist signed AAB as private draft release asset
        working-directory: source/apps/web/android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.source_sha }}
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          SHORT_SHA="${COMMIT_SHA:0:12}"
          TAG="android-rc-${SHORT_SHA}"
          cp "$AAB" "Legends-of-Kai-Jax-1.0.0-build1-${SHORT_SHA}.aab"
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$REPOSITORY"               --target "$COMMIT_SHA"               --title "Android RC 1.0.0 build 1 (${SHORT_SHA})"               --notes "Signed Google Play release candidate for exact commit ${COMMIT_SHA}."               --draft
          fi
          gh release upload "$TAG"             "Legends-of-Kai-Jax-1.0.0-build1-${SHORT_SHA}.aab"             --repo "$REPOSITORY"             --clobber

      - name: Remove temporary keystore
        if: always()
        working-directory: source/apps/web/android
        run: rm -f release-upload.jks

  ios-signed-ipa:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    name: iOS signed App Store IPA
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 || secrets.IOS_CERTIFICATE_P12 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD || secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 || secrets.IOS_PROVISIONING_PROFILE }}
      IOS_TEAM_ID: 86NUJ8M3B8
    steps:
      - name: Require iOS signing credentials
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test -n "$IOS_P12_BASE64"
          test -n "$IOS_P12_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$IOS_TEAM_ID"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact commit
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.source_sha }}
        run: |
          git clone --no-checkout "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${COMMIT_SHA}"
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"

      - name: Build web and sync iOS
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --filter ./apps/web... --frozen-lockfile
          pnpm -C apps/web build
          cd apps/web
          npx cap sync ios

      - name: Install temporary signing identity and profile
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/kai-jax-signing.keychain-db"
          CERT="$RUNNER_TEMP/distribution.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$CERT"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/profile.plist" 2>/dev/null || echo false)
          PROFILE_EXPIRATION=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")
          EXPECTED_APP_ID="$IOS_TEAM_ID.com.bobbyblanco.legendsofkaijax"

          test "$PROFILE_TEAM" = "$IOS_TEAM_ID"
          test "$PROFILE_APP_ID" = "$EXPECTED_APP_ID"
          test "$PROFILE_GET_TASK_ALLOW" != "true"
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1

          python3 - "$PROFILE_EXPIRATION" <<'PY'
          import datetime, sys
          raw = sys.argv[1].strip()
          expiry = datetime.datetime.strptime(raw, "%a %b %d %H:%M:%S %Z %Y").replace(tzinfo=datetime.timezone.utc)
          now = datetime.datetime.now(datetime.timezone.utc)
          if expiry <= now:
              raise SystemExit(f"Provisioning profile expired at {expiry.isoformat()}")
          print(f"IOS_PROFILE_EXPIRATION_OK {expiry.isoformat()}")
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          IDENTITY_LINE=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "Apple Distribution" | grep -F "($IOS_TEAM_ID)" | head -1)
          test -n "$IDENTITY_LINE"
          echo "IOS_DISTRIBUTION_IDENTITY_OK"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive signed iphoneos app
        working-directory: source/apps/web/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/LegendsOfKaiJax.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive

      - name: Export signed App Store IPA
        working-directory: source/apps/web/ios/App
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bobbyblanco.legendsofkaijax</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/LegendsOfKaiJax.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
          IPA="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          test -s "$IPA"
          codesign --verify --deep --strict build/LegendsOfKaiJax.xcarchive/Products/Applications/App.app
          shasum -a 256 "$IPA"
          printf '%s\n' "IOS_SIGNED_IPA_OK ${{ inputs.source_sha }}"

      - name: Persist signed IPA as private draft release asset
        working-directory: source/apps/web/ios/App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.source_sha }}
        run: |
          IPA="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          SHORT_SHA="${COMMIT_SHA:0:12}"
          TAG="ios-rc-${SHORT_SHA}"
          OUTPUT="Legends-of-Kai-Jax-1.0.0-build1-${SHORT_SHA}.ipa"
          cp "$IPA" "$OUTPUT"
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$REPOSITORY"               --target "$COMMIT_SHA"               --title "iOS RC 1.0.0 build 1 (${SHORT_SHA})"               --notes "Signed App Store release candidate for exact commit ${COMMIT_SHA}."               --draft
          fi
          gh release upload "$TAG" "$OUTPUT" --repo "$REPOSITORY" --clobber

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          if [ -n "${IOS_KEYCHAIN:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
