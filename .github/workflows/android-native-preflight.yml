name: Android Native Preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-preflight-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Materialize exact web workspace
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git config core.sparseCheckout true
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set apps/web packages
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          test -f pnpm-lock.yaml
          test -f apps/web/android/app/build.gradle
          test -f apps/web/android/variables.gradle

      - name: Verify Java and Android toolchain
        run: |
          java -version
          test -n "${ANDROID_HOME:-}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node --version
          pnpm --version

      - name: Install web workspace
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --filter ./apps/web... --frozen-lockfile

      - name: Validate Google Play admission metadata
        run: |
          grep -q "appId: 'com.bobbyblanco.legendsofkaijax'" apps/web/capacitor.config.ts
          grep -q 'applicationId "com.bobbyblanco.legendsofkaijax"' apps/web/android/app/build.gradle
          grep -q 'compileSdkVersion = 36' apps/web/android/variables.gradle
          grep -q 'targetSdkVersion = 36' apps/web/android/variables.gradle
          grep -q 'minSdkVersion = 22' apps/web/android/variables.gradle
          grep -q "com.android.tools.build:gradle:8.10.1" apps/web/android/build.gradle
          grep -q 'gradle-8.11.1-all.zip' apps/web/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build production web payload
        run: pnpm -C apps/web build

      - name: Sync Capacitor Android project
        # Android sync regenerates capacitor.settings.gradle and the Cordova
        # compatibility Gradle variables consumed by capacitor.build.gradle.
        run: pnpm -C apps/web exec cap sync android

      - name: Build debug APK and unsigned release AAB
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug bundleRelease --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Native preflight evidence
        if: always()
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Android native preflight completed for ${COMMIT_SHA}"
          if test -f apps/web/android/app/build/outputs/apk/debug/app-debug.apk; then
            sha256sum apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          if test -f apps/web/android/app/build/outputs/bundle/release/app-release.aab; then
            sha256sum apps/web/android/app/build/outputs/bundle/release/app-release.aab
          fi
          echo "This proves exact-head Android compilation/package generation only. It does not sign or publish to Google Play."
