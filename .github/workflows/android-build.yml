name: Build Android APK

on:
  push:
    branches: [ "artifact/sideload-apk-20261101" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    name: Handoff published APK
    runs-on: ubuntu-latest
    steps:
      - name: Download exact published APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download apk-main-92fe215 \
            --repo "${{ github.repository }}" \
            --pattern "Legends-of-Kai-Jax-main.apk"
          test -s Legends-of-Kai-Jax-main.apk
          sha256sum Legends-of-Kai-Jax-main.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: kai-jax-sideload-apk
          path: |
            Legends-of-Kai-Jax-main.apk
            SHA256SUMS.txt
          if-no-files-found: error
