name: Kai-Jax desktop bundle contract
on:
  pull_request:
    paths:
      - 'desktop_suite/**'
      - 'tests/test_desktop_bundle_contract.py'
      - '.github/workflows/desktop-bundle-contract.yml'
      - '.github/workflows/nextwave-cross-os-build.yml'
permissions:
  contents: read
jobs:
  bundle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask psutil
      - run: python tests/test_desktop_bundle_contract.py -v
      - run: bash -n desktop_suite/build_macos_linux.sh
