<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legends of Kai-Jax - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      color: #88d0ff;
      overflow: hidden;
      position: relative;
    }

    /* Animated background particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #88d0ff;
      border-radius: 50%;
      opacity: 0.6;
      animation: float 15s infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0.6;
      }
      50% {
        transform: translateY(-100px) translateX(50px);
        opacity: 0.2;
      }
    }

    .splash-content {
      text-align: center;
      z-index: 1;
      position: relative;
      padding: 40px;
    }

    .logo {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 
        0 0 20px rgba(136, 208, 255, 0.5),
        0 0 40px rgba(136, 208, 255, 0.3),
        0 0 60px rgba(136, 208, 255, 0.1);
      animation: pulse 2s ease-in-out infinite;
      background: linear-gradient(135deg, #88d0ff 0%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.9;
      }
    }

    .subtitle {
      font-size: 18px;
      color: #88d0ff;
      margin-bottom: 40px;
      opacity: 0.8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .loading-container {
      width: 300px;
      margin: 0 auto;
    }

    .loading-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(136, 208, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #88d0ff 0%, #ffd700 50%, #88d0ff 100%);
      background-size: 200% 100%;
      animation: loading 2s ease-in-out infinite, shimmer 3s linear infinite;
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(136, 208, 255, 0.5);
    }

    @keyframes loading {
      0% {
        width: 0%;
      }
      50% {
        width: 70%;
      }
      100% {
        width: 100%;
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .loading-text {
      font-size: 14px;
      color: #88d0ff;
      opacity: 0.7;
      margin-top: 10px;
      animation: fade 2s ease-in-out infinite;
    }

    @keyframes fade {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    .version {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 12px;
      color: #88d0ff;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="splash-content">
    <div class="logo">⚡ KAI-JAX</div>
    <div class="subtitle">The Memory Hero</div>
    
    <div class="loading-container">
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <div class="loading-text">Initializing...</div>
    </div>
  </div>

  <div class="version" id="version">v1.0.0</div>

  <script>
    // Create animated particles
    const particlesContainer = document.getElementById('particles');
    const particleCount = 30;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = (10 + Math.random() * 10) + 's';
      particlesContainer.appendChild(particle);
    }

    // Update loading text
    const loadingTexts = ['Initializing...', 'Loading assets...', 'Preparing game...', 'Almost ready...'];
    let textIndex = 0;
    const loadingText = document.querySelector('.loading-text');

    setInterval(() => {
      textIndex = (textIndex + 1) % loadingTexts.length;
      if (loadingText) {
        loadingText.textContent = loadingTexts[textIndex];
      }
    }, 2000);

    // Get version from electron if available
    if (window.electronAPI) {
      window.electronAPI.getAppVersion().then(version => {
        const versionEl = document.getElementById('version');
        if (versionEl) {
          versionEl.textContent = `v${version}`;
        }
      });
    }
  </script>
</body>
</html>
